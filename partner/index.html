<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美容室テンプレート提案画面 — SiteVibe</title>
  <meta name="description" content="美容室向けWebサイト提案時に、店舗の方向性に合わせてテンプレートを選べる画面です。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/partner.css">
</head>
<body>
  <header class="partner-header">
    <a href="/" class="partner-logo">SiteVibe</a>
    <a href="/templates/" class="partner-link">テンプレート一覧</a>
  </header>

  <main class="partner-main">
    <section class="partner-intro">
      <span class="partner-eyebrow">Partner Select</span>
      <h1>お客様のタイプに合わせて、提案テンプレートを選ぶ。</h1>
      <p>店舗の強み、客層、予約前の不安に合わせて、営業デモで見せるテンプレートを切り替えられます。</p>
    </section>

    <section class="selector">
      <div class="selector__panel">
        <label for="salonName">サンプル店名</label>
        <input id="salonName" type="text" value="calm hair garden" autocomplete="off">
        <p>デモ生成時の仮店名として使用します。あとから差し替えできます。</p>
      </div>
      <div class="selector__panel selector__panel--result">
        <span>選択中</span>
        <strong id="selectedTemplateName">未選択</strong>
        <p id="selectedTemplateSummary">提案するテンプレートを選んでください。</p>
        <button id="demoButton" type="button" disabled>デモを開く</button>
      </div>
    </section>

    <section class="partner-grid" id="partnerGrid" aria-label="テンプレート候補"></section>
  </main>

  <script type="module" src="js/partner.js"></script>
</body>
</html>
